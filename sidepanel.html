<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; }
    .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 10px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    .result-box { margin-top: 15px; padding: 12px; background-color: #e8f0fe; border-radius: 4px; font-weight: bold; color: #1967d2; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Python 연동 계산기</h3>
    <input type="number" id="numInput" placeholder="숫자 입력 (예: 100)" />
    <button id="calcBtn">10% 더하기 계산</button>
    <div id="resultArea" class="result-box">결과가 여기에 표시됩니다.</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
