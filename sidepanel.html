<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="entrance.css">
</head>

<body>

    <!-- 2. 환율 계산기 카드 -->
    <div id="currencyCardContainer">

    </div> 

    <!-- 3. 최종 계산기 카드 (관세 + 판매세 + 국제 배송비 통합) -->
    <div class="card">
        <h3>수입 원가 계산기 (관세+세금+배송비)</h3>

        <div class="input-group">
            <div style="flex: 1;">
                <label>소싱 국가 (출발국)</label>
                <select id="originCountry" style="width: 100%;"></select>
            </div>
            <div style="flex: 1;">
                <label>도착 주 (Province)</label>
                <select id="canadaProvince" style="width: 100%;"></select>
            </div>
        </div>

        <div class="input-group">
            <div style="flex: 1;">
                <label>품목 카테고리</label>
                <select id="itemCategory" style="width: 100%;">
                    <!-- 여기는 productCategory.js 기능으로 채움 -->
                </select>
            </div>
            <div style="flex: 1;">
                <label>국제 운송 방식</label>
                <select id="shippingMethod" style="width: 100%;">
                    <!-- 여기는 shippingMethod.js 기능으로 채움 -->
                </select>
            </div>
        </div>

        <div class="input-group">
            <div style="flex: 2;">
                <label>개당 원가 (CAD)</label>
                <input type="number" id="cadPriceInput" placeholder="예: 50" />
            </div>
            <div style="flex: 1;">
                <label>수량 (개)</label>
                <input type="number" id="quantityInput" value="1" min="1" />
            </div>
        </div>

        <!-- 새로 추가된 무게 및 박스 크기 입력칸 -->
        <div class="input-group">
            <div style="flex: 1;">
                <label>개당 무게 (g)</label>
                <input type="number" id="weightInput" value="200" placeholder="예: 200" />
            </div>
            <div style="flex: 1;">
                <label>가로 (cm)</label>
                <input type="number" id="lengthInput" value="20" />
            </div>
        </div>

        <!-- 2줄: 세로 + 높이 -->
        <div class="input-group">
            <div style="flex: 1;">
                <label>세로 (cm)</label>
                <input type="number" id="widthInput" value="15" />
            </div>
            <div style="flex: 1;">
                <label>높이 (cm)</label>
                <input type="number" id="heightInput" value="10" />
            </div>
        </div>

        <div style="margin: 8px 0; font-size: 13px; color: #333;">
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="useFtaCheck" checked style="width: auto;" />
                FTA 원산지 면세 적용 (한국/미국산)
            </label>
            <br />
            <label
                style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; margin-top: 4px;">
                <input type="checkbox" id="gstRegCheck" style="width: auto;" />
                사업자 GST/HST 환급 적용 (PST만 계산)
            </label>
        </div>

        <button id="taxDutyBtn">관세 + 세금 + 배송비 계산하기 (Enter)</button>
        <div id="taxDutyResultArea" class="result-box">단가와 무게를 입력해 계산하세요.</div>
    </div>

    <!-- 4. 새로 분리된 아마존 판매가 & 마진 계산기 카드 -->
    <div class="card">
        <h3>Amazon 캐나다 판매가 & 마진 계산기</h3>

        <div class="input-group">
            <div style="flex: 1.5;">
                <label>개당 수입원가 (CAD)</label>
                <input type="number" id="amzLandedCostInput" placeholder="예: 20.00" />
            </div>
            <div style="flex: 1;">
                <label>목표 순마진 (%)</label>
                <input type="number" id="targetMarginInput" value="30" min="1" max="79" />
            </div>
        </div>

        <div class="input-group">
            <div style="flex: 1;">
                <label>배송 방식</label>
                <select id="fulfillmentType" style="width: 100%;">
                    <option value="FBA" selected>FBA (아마존 창고)</option>
                    <option value="FBM">FBM (셀러 직접배송)</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label>보관 기간 (개월)</label>
                <input type="number" id="storageMonthsInput" value="1" min="0" step="0.5" />
            </div>
        </div>

        <!-- FBM 선택 시에만 참고할 로컬 배송비 입력칸 -->
        <div class="input-group">
            <div style="flex: 1;">
                <label>FBM 로컬 배송비 (CAD, FBA면 0)</label>
                <input type="number" id="fbmShippingInput" value="0" min="0" />
            </div>
        </div>

        <div style="margin: 8px 0; font-size: 13px; color: #333;">
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="peakSeasonCheck" style="width: auto;" />
                연말 성수기(10~12월) 창고 보관료 적용
            </label>
            <br />
            <label
                style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; margin-top: 4px;">
                <input type="checkbox" id="indivPlanCheck" style="width: auto;" />
                개인 셀러 플랜 적용 (건당 $1.49 추가)
            </label>
        </div>

        <button id="amazonFeeBtn">아마존 권장 판매가 계산하기 (Enter)</button>
        <div id="amazonResultArea" class="result-box">수입원가와 목표 마진을 입력해 계산하세요.</div>
    </div>



    <script src="currency.js"></script> <!-- 환율계산기 -->
    <script src="origins.js"></script>
    <script src="provinces.js"></script>
    <script src="productCategory.js"></script>
    <script src="shippingMethod.js"></script>
    <script src="sidepanel.js"></script>
    <script src="sidepanelCurrencyCalc.js"></script>  <!-- sidepanel에서 환율계산기만 분리 -->
    <script src="sidepanelShipping.js"></script>  <!-- sidepanel에서 관세+세금+배송비 계산기만 분리 -->
    <script src="sidepanelAmazon.js"></script>  <!-- sidepanel에서 아마존관련 계산기만 분리 -->
    
</body>

</html>
