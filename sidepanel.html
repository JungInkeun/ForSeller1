<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="entrance.css">
</head>

<body>

    <!-- 2. 환율 계산기 카드 -->
    <div class="card">
        <h3>실시간 환율 계산기</h3>

        <label>From (보유 통화 및 금액)</label>
        <div class="input-group">
            <select id="fromCurrency">
                <!-- 여기는 currency.js 기능으로 채움 -->
            </select>
            <input type="number" id="amountInput" placeholder="예: 50000" />
        </div>

        <label>To (변환할 통화)</label>
        <div class="input-group">
            <select id="toCurrency" style="width: 100%;">
                <!-- 여기는 currency.js 기능으로 채움 -->
            </select>
        </div>

        <button id="convertBtn">환율 변환하기 (Enter)</button>
        <div id="convertResultArea" class="result-box">통화를 선택하고 숫자를 입력하세요.</div>
    </div>

    <!-- 3. 최종 계산기 카드 (관세 + 판매세 + 국제 배송비 통합) -->
    <div class="card">
        <h3>수입 원가 계산기 (관세+세금+배송비)</h3>

        <div class="input-group">
            <div style="flex: 1;">
                <label>소싱 국가 (출발국)</label>
                <select id="originCountry" style="width: 100%;"></select>
            </div>
            <div style="flex: 1;">
                <label>도착 주 (Province)</label>
                <select id="canadaProvince" style="width: 100%;"></select>
            </div>
        </div>

        <div class="input-group">
            <div style="flex: 1;">
                <label>품목 카테고리</label>
                <select id="itemCategory" style="width: 100%;">
                    <!-- 여기는 productCategory.js 기능으로 채움 -->
                </select>
            </div>
            <div style="flex: 1;">
                <label>국제 운송 방식</label>
                <select id="shippingMethod" style="width: 100%;">
                    <!-- 여기는 shippingMethod.js 기능으로 채움 -->
                </select>
            </div>
        </div>

        <div class="input-group">
            <div style="flex: 2;">
                <label>개당 원가 (CAD)</label>
                <input type="number" id="cadPriceInput" placeholder="예: 50" />
            </div>
            <div style="flex: 1;">
                <label>수량 (개)</label>
                <input type="number" id="quantityInput" value="1" min="1" />
            </div>
        </div>

        <!-- 새로 추가된 무게 및 박스 크기 입력칸 -->
        <div class="input-group">
            <div style="flex: 1.2;">
                <label>개당 무게 (g)</label>
                <input type="number" id="weightInput" value="200" placeholder="예: 200" />
            </div>
            <div style="flex: 1;">
                <label>가로 (cm)</label>
                <input type="number" id="lengthInput" value="20" />
            </div>
            <div style="flex: 1;">
                <label>세로 (cm)</label>
                <input type="number" id="widthInput" value="15" />
            </div>
            <div style="flex: 1;">
                <label>높이 (cm)</label>
                <input type="number" id="heightInput" value="10" />
            </div>
        </div>

        <div style="margin: 8px 0; font-size: 13px; color: #333;">
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer;">
                <input type="checkbox" id="useFtaCheck" checked style="width: auto;" />
                FTA 원산지 면세 적용 (한국/미국산)
            </label>
            <br />
            <label
                style="display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; margin-top: 4px;">
                <input type="checkbox" id="gstRegCheck" style="width: auto;" />
                사업자 GST/HST 환급 적용 (PST만 계산)
            </label>
        </div>

        <button id="taxDutyBtn">관세 + 세금 + 배송비 계산하기 (Enter)</button>
        <div id="taxDutyResultArea" class="result-box">단가와 무게를 입력해 계산하세요.</div>
    </div>


    <script src="currency.js"></script>
    <script src="origins.js"></script>
    <script src="provinces.js"></script>
    <script src="productCategory.js"></script>
    <script src="shippingMethod.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
